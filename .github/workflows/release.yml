name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua syntax check (loaded files only)
        run: |
          sudo apt-get install -y -qq lua5.4 >/dev/null
          python3 tools/check_syntax.py --loaded
      - name: Build zip
        run: python3 tools/build.py
      - name: Check tag matches info.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import json;print(json.load(open('info.json'))['version'])")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != info.json $V"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: dist/*.zip
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: dist/release-notes.md
