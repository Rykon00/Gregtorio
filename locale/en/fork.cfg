[tips-and-tricks-item-description]
gregtorio-tiers=Gregtorio follows GT New Horizons through its voltage tiers: steam, then LV, MV, HV, EV, IV, LuV, ZPM, UV, UHV, UEV, UIV, UMV, UXV and MAX. Every tier has its science pack, its machines, energy hatches and cables; a machine of a higher tier works faster and draws more power.\nThe tips of this category unlock with each tier's science pack and name the tier's goals.
gregtorio-tier-steam=Make bronze from copper and tin and build the steam machines, fed by a [technology=small-coal-boiler]. Coke comes from the [entity=coke-oven], steel from the [entity=primitive-blast-furnace] ([technology=steel-processing]).\nGoal: electricity from the [technology=steam-turbine] and the LV science pack ([technology=logistic-science-pack]).
gregtorio-tier-lv=Almost every machine type now has an electric LV version. Build the [technology=electric-blast-furnace], the [technology=chemical-reactor] and [technology=plastics]; [technology=gas-turbine]s burn the gases.\nGoal: the MV science pack ([technology=military-science-pack]).
gregtorio-tier-mv=Smelt [technology=aluminium] in the Electric Blast Furnace, make [technology=stainless-steel] and [technology=kanthal-coils], start [technology=oil-gathering] and [technology=advanced-oil-processing]. The [technology=me-network] stores items and fluids, [technology=rocketry] prepares the way to space.\nGoal: the HV science pack ([technology=chemical-science-pack]).
gregtorio-tier-hv=[technology=reach-the-moon] for its titanium, chrome and rare earth ores. The [technology=large-chemical-reactor] and [technology=nichrome-coils] open the next materials.\nGoal: the EV science pack ([technology=production-science-pack]).
gregtorio-tier-ev=Process [technology=titanium] and [technology=tungstensteel], start the platinum line ([technology=platinum-line-initialization]) and [technology=nuclear-power], [technology=reach-mars]. The ME network learns [technology=me-autocrafting].\nGoal: the IV science pack ([technology=utility-science-pack]).
gregtorio-tier-iv=Build the [technology=assembly-line], which makes the parts of every later tier, and the [technology=fluid-nuclear-reactor]; [technology=reach-the-jovian-moons].\nGoal: the LuV science pack ([technology=space-science-pack]).
gregtorio-tier-luv=The [technology=circuit-assembly-line] for better circuits, [technology=naquadah-processing] and [technology=naquadah-alloy], power from the [technology=fusion-reactor-mk1] and the [technology=plasma-turbine].\nGoal: the ZPM science pack ([technology=metallurgic-science-pack]).
gregtorio-tier-zpm=The [technology=fusion-reactor-mk2] and the [technology=zpm-assembly-line] make the next materials and parts; [technology=naquadah-fuels] and the [technology=biolab] follow.\nGoal: the UV science pack ([technology=agricultural-science-pack]).
gregtorio-tier-uv=The last tier of the original GregTech: [technology=wetware-processors], the [technology=large-naquadah-reactor] and the [technology=uv-plasma-turbine].\nGoal: the UHV science pack ([technology=electromagnetic-science-pack]).
gregtorio-tier-uhv=[technology=bio-processors], the [technology=fusion-reactor-mk3] and the [technology=naquadah-fuel-refinery].\nGoal: the UEV science pack ([technology=cryogenic-science-pack]).
gregtorio-tier-uev=[technology=optical-processors] and the [technology=fusion-reactor-mk4].\nGoal: the UIV science pack ([technology=promethium-science-pack]).
gregtorio-tier-uiv=[technology=exotic-processors] and the [technology=fusion-reactor-mk5], which makes spacetime and universium.\nGoal: the UMV science pack ([technology=umv-science-pack]).
gregtorio-tier-umv=[technology=temporal-processors] and the [technology=quantum-force-transformer], which runs whole material lines in one step.\nGoal: the UXV science pack ([technology=uxv-science-pack]).
gregtorio-tier-uxv=Build the [technology=stargate]: it makes the MAX science pack, and the first level of victory wins the game.
gregtorio-tier-max=After the victory: the MAX tier is built from magmatter, the [technology=godforge-upgrades] and the further levels of victory are the long-term goal.

[fork-machine]
fluid-heater=Heats fluids, such as water into steam and GT's heating steps of the chemical lines.
packager=Packs small and tiny piles of a dust into the dust.
advanced-boiler=GT++'s advanced boiler: burns solid fuels for more steam than the steam age boilers.
alloy-blast-smelter=Melts the metals of an alloy together into the molten alloy, faster than mixing their dusts.
alloy-smelter=Smelts two metals or dusts into an alloy ingot, or shapes ingots with a mold.
arc-furnace=Smelts with an electric arc and oxygen, and recycles items into their ingots.
assembling-machine=Assembles parts, components and machines from several ingredients and fluids.
assembly-line=Builds the parts of the higher tiers from many ingredients and fluids.
autoclave=Grows crystals from dusts in water and other fluids under pressure.
bending-machine=Bends ingots and plates into plates, double plates, foil, rings and pipes.
brewery=Brews items with a fluid into a new fluid, such as plants into biomass.
canning-machine=Fills items into cells and containers and empties them.
centrifuge=Separates dusts and fluids into their components.
chemical-bath=Washes items in a fluid, such as crushed ore in mercury or sodium persulfate for its byproducts.
chemical-reactor=Runs chemical reactions of items and fluids.
circuit-assembler=Assembles circuits and their parts with solder.
combustion-generator=Burns liquid fuels for electricity.
compressor=Compresses dusts, plates and other items into denser forms such as plates, blocks and gems.
cracker=Cracks fuels and gases with steam or hydrogen into lighter ones.
cutting-machine=Cuts blocks, ingots and boules into plates, rods, wafers and planks with water or lubricant.
dehydrator=Dries and heats items and fluids and splits them into their parts.
dimension-miner=Runs the vein recipes of the other dimensions with power.
distillery=Distills a fluid into one of its products, chosen by the recipe.
drilling-rig=Pumps fluids such as oil and natural gas from the ground.
electric-blast-furnace=Smelts metals that need high heat; its coils set the highest temperature it reaches.
electric-furnace=Smelts items with electricity.
electrolyzer=Splits dusts and fluids into their elements by electrolysis.
electromagnetic-separator=Sorts the magnetic dusts from pure dusts, for their byproducts.
extractor=Extracts items and fluids from blocks, plants and other items, such as rubber from resin.
extruder=Shapes ingots and dusts with an extruder shape into rods, bolts, pipes, gears, casings and more.
fermenter=Ferments biomass and other organic fluids.
fluid-extractor=Melts or presses items into fluids.
fluid-solidifier=Casts fluids and molten metals into shapes with a mold.
forge-hammer=Hammers ingots into plates and crushes ores and stones.
forming-press=Presses items together, such as circuit boards and data sticks.
gas-turbine=Burns gases for electricity.
implosion-compressor=Compresses dusts into gems and other items with explosives.
large-chemical-reactor=Runs chemical reactions with more ingredients and products.
large-naquadah-reactor=Burns naquadah fuels for large amounts of electricity.
large-plasma-turbine=Turns plasma into electricity.
large-sifter=Sifts purified ores into gems, many at once.
laser-engraver=Engraves wafers and other items with a lens.
lathe=Turns ingots and rods into rods, bolts and screws.
macerator=Grinds ores and items into dusts; ores give more and byproducts in higher tiers.
miner=Mines the map veins under it.
mixer=Mixes dusts and fluids into new dusts and fluids.
multismelter=Smelts many items at once.
ore-washer=Washes crushed ore in water into purified ore with byproducts.
polarizer=Magnetizes rods and other items.
pyrolyse-oven=Heats logs and organic matter without air into charcoal and chemicals.
rock-crusher=Makes stone and minerals from lava and water.
rocket-engine=Burns rocket fuels for electricity.
semifluid-generator=Burns heavy oils and other semi-fluid fuels for electricity.
short-distillation-tower=Distills a fluid into all of its products at once.
sifting-machine=Sifts purified ores into gems.
steam-turbine=Turns steam into electricity.
tall-distillation-tower=Distills a fluid into all of its products at once.
thermal-centrifuge=Separates purified and crushed ores with heat into centrifuged ore and byproducts.
vacuum-freezer=Cools hot ingots and freezes fluids.
wiremill=Draws ingots and rods into wires and fine wires.
