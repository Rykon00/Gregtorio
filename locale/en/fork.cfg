[technology-description]
dyson-swarm=gtnhintergalactic's Dyson Swarm: a ground unit that sends Dyson Swarm Modules into space and receives their power, 195.3 MW per module, up to 10 000 modules; the swarm loses some of its modules every hour.
froth-processing=The flotation froths in the Utupu-Tanuri's vacuum furnace: rare byproducts in bulk (indium, rhodium, ruthenium, hafnium, dysprosium, thallium, rhenium, the lanthanides) and Poor Nether Waste from netherrack.
lv-miner=GT's Basic Miner (LV), a mining drill of the map veins, and the Mining Pipe; its LV Dimension Miner runs the other dimensions' vein recipes. The MV Miner comes with Advanced MV Machines, the HV Miner with HV Machines.
milling-and-flotation=GT++'s IsaMill and the Froth Flotation Cell: milled ores and their froths, pine oil, the xanthates and the milling balls, nefarious oil from Nether air.
netherite=GT's netherite chain: ancient debris from the Nether, netherite scrap and its seed, brittle scrap, netherite nanoparticles bonded with hellish metal, netherite foil and the Naquarite Universal Insulator Foil of the late coils.
ore-drilling-plant-mk1=GT's Ore Drilling Plant (MV), a mining drill of the map veins that drinks Drilling Fluid, and its Dimension Drilling Plant for the other dimensions' vein recipes.
ore-drilling-plant-mk2=GT's Ore Drilling Plant II (HV) and its Dimension Drilling Plant: faster, a larger area.
ore-drilling-plant-mk3=GT's Ore Drilling Plant III (EV) and its Dimension Drilling Plant: faster, a larger area.
ore-drilling-plant-mk4=GT's Ore Drilling Plant IV (IV) and its Dimension Drilling Plant: faster, a larger area.
classic-lv-miner=GT's Basic Miner (LV), which runs the vein recipes with power, and the Mining Pipe. The MV Miner comes with Advanced MV Machines, the HV Miner with HV Machines.
classic-ore-drilling-plant-mk1=GT's Ore Drilling Plant (MV), which runs the vein recipes with power and Drilling Fluid.
classic-ore-drilling-plant-mk2=GT's Ore Drilling Plant II (HV): faster.
classic-ore-drilling-plant-mk3=GT's Ore Drilling Plant III (EV): faster.
classic-ore-drilling-plant-mk4=GT's Ore Drilling Plant IV (IV): faster.
black-steel=Black steel from steel, black bronze and nickel dust (blast furnace, chemical bath with lapis coolant) and the dusts it takes. Once Basic Extended Crafting: its crafting table went with the microverse.
the-deep-dark=GT New Horizons' T10 dimension (UHV): the Void Miner III mines every raw ore there, in equal shares.
void-miner-i=bartworks' Void Miner I (LuV) and the ores of Pluto (black plutonium, neutronium, adamantium) and of GT New Horizons' other T3 to T7 dimensions.
space-elevator=gtnhintergalactic's Space Elevator (UHV) with Mk-I motors: its controller, casings, cable and motors. It carries the Space Elevator modules.
space-elevator-motor-mk2=The Space Elevator's Mk-II motors: up to 12 modules.
space-elevator-motor-mk3=The Space Elevator's Mk-III motors: up to 15 modules.
space-elevator-motor-mk4=The Space Elevator's Mk-IV motors: up to 18 modules.
space-elevator-motor-mk5=The Space Elevator's Mk-V motors: up to 24 modules.
space-elevator-mining-module-mk1=gtnhintergalactic's Space Elevator Mining Module Mk-I (2 operations at a time), the mining drones Mk-I to Mk-X and their drill heads, and space mining of the asteroids.
space-elevator-mining-module-mk2=The Space Elevator Mining Module Mk-II: 4 operations at a time and the asteroids above the Mk-I's voltage.
space-elevator-mining-module-mk3=The Space Elevator Mining Module Mk-III: 8 operations at a time and the Mining Drone Mk-XI.
space-elevator-mining-drones-umv=The Mining Drone Mk-XII and its asteroids.
space-elevator-mining-drones-uxv=The Mining Drone Mk-XIII and its asteroids.
void-miner-ii=bartworks' Void Miner II (ZPM) and the ores of Barnard F (among them bedrockium) and of the other T8 dimensions. Black plutonium from the Void Miner I's ore (ZPM blast furnace) for its frames, plates and screws.
void-miner-iii=bartworks' Void Miner III (UV) and the ores of Horus (cosmic neutronium), Anubis (infinity catalyst), Seth (raw tengam, tartarite) and Maahes (naquadria).
reach-the-asteroid-belt=The asteroid belt, GT New Horizons' T3 dimension (IV): the platinum vein (sheldonite, palladium, platinum) and the naquadah vein.
reach-the-jovian-moons=Callisto and Europa, GT New Horizons' T3 dimensions (IV): the callisto ice vein and the ledox vein.
reach-venus=Venus, GT New Horizons' T4 dimension (LuV): the quantium vein.
kevlar=GT New Horizons' Kevlar line (UV): acetylene, ethylene oxide and glycol, methylamine, nickel tetracarbonyl, nitrobenzene and aniline and the steps to liquid crystal Kevlar and polyurethane resin.
radox-polymer=GT New Horizons' radox polymer (UEV): xenoxene from the bacterial vat, raw radox from the pyrolyse oven, its distillation and cracking with silver plasma, radox gas with oxygen and titanium plasma. Stand-ins: mutagen for the Xenoxsis culture, wood for the Barnarda C logs.
naquadah-fuel-rods=GT's naquadah fuel rods: the Large Tungstensteel Fluid Cell canned with enriched naquadah dust, dual and quad rods, ten times a uranium rod per cell; the depleted rods give naquadah, naquadria, tungstensteel and platinum metallic powder back in the EV centrifuge.
the-core=GT's fifth naquadah rod: 32 naquadah fuel rods with long tungstensteel rods and bartworks' tiberium dust in the LuV assembler, 10 880 times a uranium rod; the depleted Core gives 8 depleted quad naquadah rods, zirconium and tungstensteel back in the IV centrifuge.
liquid-fluoride-thorium-reactor=GT++'s Liquid Fluoride Thorium Reactor (IV) and its fuels: the isotopes from GT's IV centrifuge of depleted rods, lithium, beryllium, zirconium, thorium and uranium fluorides, Hastelloy-N, the Reactor Fuel Processing Plant that mixes LFTR Fuel 1 to 3 and the reactor that burns them with lithium tetrafluoroberyllate.
nuclear-salt-processing=GT++'s Reactor Processing Unit and Cold Trap: the LFTR's depleted salts back into lithium and beryllium fluoride, uranium hexafluoride, uranium 233, protactinium and phosphorus with sodium fluoride, and GT++'s LFTR Fuel Base from the stable molten salt base, which the Reactor Fuel Processing Plant makes into LFTR Fuel 2 and 3, and the Nuclear Salt Processing Plant that runs the Reactor Processing Unit's and the Cold Trap's recipes ten times as fast.
sparge-tower=GT++'s Sparge Tower (LuV) with HS188-A and rhenium: helium and fluorine sparging of the LFTR's salts, which the Reactor Processing Unit turns into twice as much.
reach-ross128=Ross128b, GT New Horizons' T3 dimension (IV): its ten veins (thorianite, carbon, bismuth, alkali tourmaline, roquesite, tungstate, copper sulfide with bornite's only source, forsterite, hedenbergite, red zircon) with bartworks' ores.
reach-ross128ba=Ross128ba, the moon of Ross128b and GT New Horizons' T5 dimension (ZPM): the tiberium, BArTiMaEuSNeK, amethyst and fluorspar veins.
reach-the-everglades=GT++'s Toxic Everglades, reached through a portal whose frame is a LuV assembler recipe: its 20 veins GTPP0 to GTPP19 with GT++'s ores (agardites, cerite, crocoite, the gadolinites, xenotime, zircon, runite and more).
reach-the-moon=The Moon, GT New Horizons' T1 dimension (HV): the titanium-chrome vein (ilmenite, chromite), the bauxite vein (bauxite, ilmenite, aluminium) and the monazite vein (bastnasite, monazite, neodymium), with their ore chains; moon turf from a dig site and the moon dust in it (HV macerator and centrifuge).
reach-mars=Mars and its moons Phobos and Deimos, GT New Horizons' T2 dimensions (EV): the tungstate vein (scheelite, tungstate), the pitchblende vein (pitchblende, uraninite), the uranium vein, the draconium vein (draconium, jade, vinteum), the oriharukon vein (oriharukon, tanzanite) and the heavy pentele vein (arsenic, bismuth, antimony).
reach-the-nether=The Nether, GT New Horizons' first dimension (steam age), through a Nether Portal: its 11 veins, hunting blazes for their rods, soul sand, obsidian from the dig site, and nether air from the compressor.
reach-the-twilight-forest=The Twilight Forest, GT New Horizons' T0 dimension (LV), through a Twilight Portal opened with the Twilight Crystal: a dense forest at permanent dusk with 15 veins, among them galena (lead, silver) and nickel.
ender-storage=EnderStorage's Ender Chest and Ender Tank: chests and tanks of the same three-colour code share their contents between Nauvis, the Nether, the Twilight Forest and The End.
reach-the-end=The End (HV), through an End Portal of 12 Eyes of Ender: islands of end stone in the void with GT New Horizons' 7 End veins, end stone from the Dig Site and ender air from the compressor there, whose distillation gives radon.
dtpf-max-recipes=GT New Horizons' MAX recipes of the plasma forge: the timepiece, the conversions of time into space and back, and chipped amalgatite, with the mod's endgame materials for the ones it lacks.
qft-temporal-harmony=The QFT's temporal harmony: a block of universium, a MAX field generator and raw star matter give a timepiece, molten eternity and tachyon rich temporal fluid.
ev-chemical-dehydrator=GT++'s EV dehydrator with its coil: the coil wire from the laser engraver, the dehydrator coil from the assembler.
iv-chemical-dehydrator=GT++'s IV dehydrator with its coil: the coil wire from the laser engraver, the dehydrator coil from the assembler.
luv-chemical-dehydrator=GT++'s LuV dehydrator with its coil: the coil wire from the laser engraver, the dehydrator coil from the assembler.
zpm-chemical-dehydrator=GT++'s ZPM dehydrator with its coil: the coil wire from the laser engraver, the dehydrator coil from the assembler.
europium-processing=GT New Horizons' europium from the monazite line (ZPM): the electromagnetic separator's europium (III) oxide becomes europium oxide in the LuV chemical reactor and europium dust in the ZPM electrolyzer. Also europium dust from and into ingots.
zirconium-processing=GT New Horizons' zirconium (EV): the hafnia-zirconia blend of the monazite dissolution tank gives zirconia, zirconium tetrachloride and in the blast furnace hot zirconium ingots; red zircon from the sifters is electrolysed into zirconium dust. Also GT++'s sifter of purified ilmenite, which gives zirconium and hafnium dust.
lanthanum-hexaboride=GT New Horizons' lanthanum hexaboride (IV): phosgene, boric acid, boron trioxide and boron trichloride, lanthanum oxide, and the flawless lanthanum hexaboride gem from the IV autoclave.
samaric-rare-earth-processing=The samaric branch of GT New Horizons' bastnasite line: the samaric rare earth concentrate becomes samaric residue, with holmium, terbium and calcium fluoride on the way. Also GT++'s ExxonMobil Chemical Plant and the MV and HV Dehydrators, which make the ammonium nitrate dust.
bastnasite-rare-earth-processing=GT New Horizons' bastnasite line (IV): the Digester, a cracker and the Dissolution Tank turn crushed bastnasite into neodymium and lanthanum dust, with cerium dioxide on the way. Also hexafluorosilicic acid and sodium fluorosilicate.
cerium-processing=GT New Horizons' cerium line (IV): cerium dioxide or the cerium-rich mixture becomes cerium chloride, with oxalic acid cerium oxalate, in the blast furnace cerium (III) oxide and in the electrolyzer cerium dust. Also vanadium pentoxide, the catalyst of the oxalic acid.
large-combustion-engine=The large combustion engine (EV): the combustion generator fuel cells at 100 %, up to four EV amps.
rocket-engines=GT++'s rocket engines: the EV Rocket Engine and the H8N4C2O4 rocket fuel cell it burns.
advanced-rocket-engine=GT++'s IV Rocket Engine (Advanced Rocket Engine).
turbo-rocket-engine=GT++'s LuV Rocket Engine (Turbo Rocket Engine).
large-gas-turbine=The large gas turbine (EV): the gas turbine fuel cells at 125 % with a large magnalium rotor, up to four EV amps.
monazite-rare-earth-processing=GT New Horizons' monazite line (IV): the Digester and the Dissolution Tank turn crushed monazite into samarium and gadolinium dust, with thorium, uranium, phosphate and cerium dioxide on the way. LuV Components needs the samarium.
super-glue=Ethyl cyanoacrylate (super glue) from GT++'s glue line: formaldehyde, hydrogen cyanide and sodium cyanide, chloroacetic and cyanoacetic acid, ethyl cyanoacetate. The graphene recipes with europium and americium wafers take it.
plasma-turbine=The large plasma turbine burns the plasmas of the fusion reactors; a turbine output hatch next to it returns the cooled fluid. Also the LuV dynamo hatch, the part every large generator needs.
zpm-plasma-turbine=The ZPM dynamo hatch and the ZPM large plasma turbine (an upgrade of the LuV one, twice the output).
uv-plasma-turbine=The UV dynamo hatch and the UV large plasma turbine (an upgrade of the ZPM one, twice the output).
uhv-plasma-turbine=The UHV dynamo hatch and the UHV large plasma turbine (an upgrade of the UV one, twice the output).
uev-plasma-turbine=The UEV dynamo hatch and the UEV large plasma turbine (an upgrade of the UHV one, twice the output).
uiv-plasma-turbine=The UIV dynamo hatch and the UIV large plasma turbine (an upgrade of the UEV one, twice the output).
umv-plasma-turbine=The UMV dynamo hatch and the UMV large plasma turbine (an upgrade of the UIV one, twice the output).
uxv-plasma-turbine=The UXV dynamo hatch and the UXV large plasma turbine (an upgrade of the UMV one, twice the output).
naquadah-fuels=Naquadah based fuel MK1 from enriched naquadah (acid emulsion, emulsion, solution, light and heavy naquadah fuel, fused in the fusion reactor Mk-II) and the excited uranium and plutonium liquid fuels for the large naquadah reactor.
large-naquadah-reactor=The large naquadah reactor burns naquadah based fuel and the excited liquid nuclear fuels.
uhv-naquadah-reactor=The UHV dynamo hatch, the UHV large naquadah reactor (an upgrade of the UV one, twice the output) and naquadah based fuel MK2.
uev-naquadah-reactor=The UEV dynamo hatch, the UEV large naquadah reactor (twice the UHV output) and naquadah based fuel MK3.
uiv-naquadah-reactor=The UIV dynamo hatch and the UIV large naquadah reactor (twice the UEV output).
umv-naquadah-reactor=The UMV dynamo hatch and the UMV large naquadah reactor (twice the UIV output).
uxv-naquadah-reactor=The UXV dynamo hatch and the UXV large naquadah reactor (twice the UMV output).
lapotronic-energy-orbs=The lapotronic energy orb (IV battery) and a second recipe for the lapotronic energy orb cluster from the circuit assembler: eight orbs, qubit CPU chips and naquadah alloy instead of the lapotron chips of the ZPM assembly line.
super-coolant=Ledox and callisto ice from Jupiter's moons and super coolant from them (HV mixer). Grade 5 and 7 water and the UIV to UXV energy and dynamo hatches need it.
fluxed-electrum=Fluxed electrum from electrum, redstone and naquadah (ZPM blast furnace): the UV voltage coil, the UHV emitter and sensor, the fusion reactor Mk-III controller and naquadah based fuel MK2 use it.
bedrockium=Bedrockium from the Void Miner (UV blast furnace) and its cable, the UHV cable of the UHV components. The UEV machine casing is made of bedrockium plates.
space-coolant-cells=The 180k, 540k and 1080k space cells and the 1080k super coolant cell for the UEV to UXV energy and dynamo hatches.
quantium=Quantium from Venus (UHV blast furnace): its melt goes into the UEV components, its cable is the UMV cable of the UMV components.
dimensionally-transcendent-plasma-forge=The dimensionally transcendent plasma forge and its crude catalyst: neutronium, cosmic neutronium, infinity, transcendent metal, spacetime and universium with two thirds of the input of the fusion reactors and in a third of the reactor time.
dtpf-resplendent-catalyst=The resplendent catalyst (the crude one and five more plasmas): the plasma forge makes twice the batch in the same time and burns less catalyst per ingot.
quantum-force-transformer=The quantum force transformer: the platinum line (platinum and palladium metallic powder, the residues and the iridium group sludge) and the naquadah line in one step, one recipe per main output.
godforge=The Forge of the Gods (UMV, 13x13) at GT New Horizons' place, between the UIV and UMV energy hatches, with GT's recipes of its casings and controller (without creon, mellion and metastable oganesson); the quantum anomaly from the plasma forge (an Unknown Particle with the Chromatic Lens and the Hi-Computation Station Mk-V), chromatic glass and the resplendent catalyst.
godforge-molten-module=Universium in the Forge of the Gods: half the spacetime and flerovium per ingot of the fusion recipe, much faster.
godforge-exotic-module=Tachyon rich temporal and spatially enlarged fluid from spacetime, and magmatter, the MAX metal, from them and the melt of an endgame metal.
godforge-upgrades=Every level makes the Forge of the Gods' star matter, universium and magmatter recipes 5 % more productive. The long-term goal after victory.
dtpf-stellar-catalyst=The stellar catalyst (resplendent catalyst, lead, thorium and naquadria plasma, raw star matter): the plasma forge makes four times the crude batch in the same time, and GT's stellar tier of the Dimensionally Shifted Superfluid.
max-materials=Magmatter parts and the magmatter cable.
planck-processors=The Planck line up to the supercomputer.
planck-processor-mainframes=The MAX circuit.
max-components=The MAX components, casing and hull, and a MAX science pack recipe from MAX parts and magmatter.
max-machines=The basic machines of the MAX tier.
max-energy-hatches=The maximum voltage coil and the MAX energy hatch.
max-multiblocks=The multiblock upgrades of the MAX tier.
max-plasma-turbine=The MAX dynamo hatch and the MAX large plasma turbine (20.97 GW).
large-steam-turbine=The large steam turbine (EV): steam to power at GT's 2 L per EU with its magnalium rotor, distilled water back through the turbine output hatch, which it unlocks too.
high-pressure-steam-turbine=The large HP steam turbine (IV): superheated steam to power, the steam goes on to a large steam turbine.
fluid-nuclear-reactor=The fluid nuclear reactor heats coolant with fuel rods, the large heat exchanger turns the hot coolant into steam or superheated steam for the steam turbines. Coolant from lapis and distilled water.
luv-lapotronic-supercapacitor=The LuV lapotronic capacitor block (orb cluster and osmiridium) and the LuV lapotronic supercapacitor, an upgrade of the IV one: five times the capacity, twice the power.
zpm-lapotronic-supercapacitor=The energy module, the ZPM lapotronic capacitor block and the ZPM lapotronic supercapacitor, an upgrade of the LuV one: five times the capacity, twice the power.
planetary-gas-siphon=gtnhintergalactic's Planetary Gas Siphon: the gases of Jupiter, Saturn, Uranus and Neptune by depth.
space-elevator-pump-module-mk1=The Space Elevator Pump Module Mk-I (4 parallels) and space pumping of the planets' fluids and gases.
space-elevator-pump-module-mk2=The Space Elevator Pump Module Mk-II: 16 parallels (GT's 4 slots of 4).
space-elevator-pump-module-mk3=The Space Elevator Pump Module Mk-III: 256 parallels (GT's 4 slots of 64).
space-elevator-assembler-module-mk1=GT New Horizons' Space Elevator Assembler Module Mk-I, the space assembler of the Singularity ME Storage Cell.
transcendent-metal-nanites=GT++'s Black Titanium, the Raw and the Energised Tesseract and GT's Transcendent Metal Nanites (Nano Forge tier 2), and the Nano Forge's tier 3.
draconic-evolution-fusion-crafter=GT's Draconic Evolution Fusion Crafter (tier 1) with its casings, and Draconic Evolution's Draconic Core and its schematic.
wyvern-cores=The Fusion Crafter's tier 2 with Draconium Fusion Casings, the Wyvern Core and its schematic.
awakened-cores=The Fusion Crafter's tier 3 with Wyvern Fusion Casings, the Awakened Core and its schematic.
chaotic-cores=Chaos Shards from the Chaos Guardian (Extreme Entity Crusher) and their fragments, the Fusion Crafter's tier 4 with Awakened Draconium Fusion Casings, the Chaotic Core and its schematic.
draconic-reactor-stabilizer=Draconic Evolution's Wyvern and Draconic Flux Capacitors, EnderIO's Vibrant Capacitor Bank, the Reactor Stabilizer's parts and the Reactor Stabilizer, which the Singularity crafting storage takes.
draconic-energy-cores=The sunnarium alloys of the core mod and Draconic Evolution's Wyvern and Draconic Energy Cores.
large-rocket-engine=GT++'s Large Rocket Engine (Rocketdyne F-1A): rocket fuel cells into 2 amps of IV, and its Turbodyne Casing.
rp-1-rocket-fuel=GT++'s Rp-1 Rocket Fuel (512 EU per L) from kerosene and liquid oxygen, and its cell for the rocket engines.
hydrazine-rocket-fuels=GT++'s hydrazine rocket fuels: hydrogen peroxide by the anthraquinone process on coal tar, hydrazine, monomethylhydrazine, the Dense Hydrazine Fuel Mixture (1024 EU per L) and the CN3H7O3 Rocket Fuel (2048 EU per L) with their cells.
fermentation=GT New Horizons' LV Brewery and LV Fermenter, fermented biomass and its distillation, seed oil from wheat seeds, bio diesel (320 EU per L) with glycerol, and epichlorohydrin from glycerol.
bisphenol-a=GT New Horizons' epoxy route: isopropylbenzene (cumene) from benzene and propene, phenol and acetone from it, bisphenol A and epoxy from bisphenol A and epichlorohydrin.
polystyrene=Styrene from benzene and ethylene, polystyrene and its sheet.
styrene-butadiene-rubber=GT New Horizons' styrene-butadiene rubber from styrene and butadiene, its sheet, and cable insulation with it.
polycaprolactam=GT New Horizons' polycaprolactam (nylon) from saltpeter and naphtha, and its sheet.
jet-fuel=GoodGenerator's ferrocene line and Jet Fuel No.3 (1824 EU per L), cyclopentadiene, the combustion promoter and their cells.
jet-fuel-a=GoodGenerator's Jet Fuel A (2248 EU per L) and its cell.
universal-chemical-fuel-engine=GoodGenerator's Universal Chemical Fuel Engine: combustion and gas turbine fuel cells at 150 %, up to one amp of LuV.
thorium-based-liquid-fuel=GoodGenerator's thorium based liquid fuel for the large naquadah reactors, from high density thorium, and its excited state.
precise-assembler=GoodGenerator's Precise Auto-Assembler with Mk-I casings, the Hi-Computation Stations Mk-I and Mk-II and their parts: Signalium, Lumiium, Hikarium, MAR-M200 and MAR-Ce-M200 steel, Tanmolyium Beta-C, the engraved gold and diamond crystal chips.
precise-electronic-unit-mk2=The Mk-II casings and the Hi-Computation Station Mk-III: Adamantium Alloy, Artherium-Sn, orundum, the Crystal SoC and the Raw Advanced Crystal Chip.
precise-electronic-unit-mk3=The Mk-III casings and the Hi-Computation Stations Mk-IV and Mk-V: Dalisenite, manyullyn and the engraved energy and manyullyn crystal chips.
godforge-plasma-module=GT's plasma module upgrades of the Forge of the Gods up to the Temporal Plasma Transformation Process (GPCI to TPTP, 17 graviton shards): celestial tungsten plasma from celestial tungsten dust (6 tungsten dust engraved with the quantum anomaly) and raw star matter, the forge's fuel.
dimensionally-shifted-superfluid=GT's Dimensionally Shifted Superfluid from the plasma forge (prosaic and resplendent catalyst): stabilised baryonic matter, metastable oganesson, grade 8 water, celestial tungsten plasma and super heavy radox; the prosaic catalyst, californium, molten calcium, oganesson, GoodGenerator's enriched naquadah alloy and metastable oganesson.
prismatic-naquadah=GT's netherite chain to the Radiation Proof Prismatic Naquadah Composite Sheet: prismarine from red algae (GT++'s Algae Farm), its solution, extraction and precipitate, the prismatic crystal (the Magneto Resonatic lens), gas (the Industrial Dehydrator's vacuum furnace), acid, prismatic naquadah, the composite slurry and the sheet; with liquid nitrogen, cubic zirconia and YSZ, strontium and crystalline alloy.
nuclear-salt-processing-ii=GT++'s Cold Trap II and Reactor Processing Unit II (ZPM), the upgrades of the IV blocks, with Pikyonium 64B from the alloy blast smelter (Inconel-792, Eglin steel, enriched naquadah, cerium, antimony, platinum, ytterbium, tungstensteel) and double HS188-A plates.
high-pressure-steam=GT New Horizons' high pressure steam machines and the Large Coal Boiler: steel, twice as fast as the bronze ones.
large-batteries=GT New Horizons' HV batteries and the HV battery buffers.
cosmic-neutronium=GT New Horizons' cosmic neutronium at UV: the ore from the Void Miner III (Horus), its dust, ingot and parts, for the space elevator.
advanced-boilers=GT++'s LV and MV Advanced Boilers: 7.5 and 15 steam a second from any fuel, and their boiler chassis.
hv-advanced-boiler=GT++'s HV Advanced Boiler: 22.5 steam a second from any fuel.
lapotron-crystals=GT New Horizons' EV storage: the lapotron crystal (energium and lapotron dust, the raw crystal) and the EV battery buffers.
lapotronic-energy-orb=GT New Horizons' IV storage: the lapotronic energy orb with its engraved lapotron chips and the IV battery buffers.
hypogen=GT++'s hypogen: the Ender Dragon's dragonblood from the Extreme Entity Crusher, fused with rhugnor in the MK4 fusion reactor, and GoodGenerator's MK IV from hypogen.
six-phased-copper=GT's Six-Phased Copper from the plasma forge (molten celestial tungsten, astral titanium, hypogen, chromatic glass, rhugnor and mellion) and its long rods for the godforge glass.
nano-forge=GT's Nano Forge (tier 1) with carbon nanites from the assembly line: GT New Horizons' Melodic and Stellar Alloy (oriharukon from Horus), the Radiant Naquadah Alloy Casing and the controller.
nano-forge-t2=The Nano Forge's tier 2 with neutronium nanites, and GT's glowstone nanites from GT++'s compressed glowstone.
yocto-power-ics=GT New Horizons' YPIC: the Optically Enriched Crystalline Boule, the Photonically Prepared, Photonically Enhanced (Solar Light Splitter, glowstone nanites) and Infinite Wafer (shirabon, infinity plasma), the YPIC wafer and chip, and GTNH's UXV energy and dynamo hatches with YPIC.

