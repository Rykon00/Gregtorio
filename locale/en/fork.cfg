[technology-description]
tier-four-microminers=The tier four microminer flies to the moon: the lunar navigation data, the tungsten carbide plated microminer with its signalum engine and vibrant thrusters, compressed moon turf and its moon dust. Also signalum (alloy smelter) and the crystaltine parts of the extended crafting tables.
super-glue=Ethyl cyanoacrylate (super glue) from GT++'s glue line: formaldehyde, hydrogen cyanide and sodium cyanide, chloroacetic and cyanoacetic acid, ethyl cyanoacetate. The graphene recipes with europium and americium wafers take it.
plasma-turbine=The large plasma turbine burns the plasmas of the fusion reactors; a turbine output hatch next to it returns the cooled fluid. Also the LuV dynamo hatch, the part every large generator needs.
zpm-plasma-turbine=The ZPM dynamo hatch and the ZPM large plasma turbine (an upgrade of the LuV one, twice the output).
uv-plasma-turbine=The UV dynamo hatch and the UV large plasma turbine (an upgrade of the ZPM one, twice the output).
uhv-plasma-turbine=The UHV dynamo hatch and the UHV large plasma turbine (an upgrade of the UV one, twice the output).
uev-plasma-turbine=The UEV dynamo hatch and the UEV large plasma turbine (an upgrade of the UHV one, twice the output).
uiv-plasma-turbine=The UIV dynamo hatch and the UIV large plasma turbine (an upgrade of the UEV one, twice the output).
umv-plasma-turbine=The UMV dynamo hatch and the UMV large plasma turbine (an upgrade of the UIV one, twice the output).
uxv-plasma-turbine=The UXV dynamo hatch and the UXV large plasma turbine (an upgrade of the UMV one, twice the output).
naquadah-fuels=Naquadah based fuel MK1 from enriched naquadah (acid emulsion, emulsion, solution, light and heavy naquadah fuel, fused in the fusion reactor Mk-II) and the excited uranium and plutonium liquid fuels for the large naquadah reactor.
large-naquadah-reactor=The large naquadah reactor burns naquadah based fuel and the excited liquid nuclear fuels.
uhv-naquadah-reactor=The UHV dynamo hatch, the UHV large naquadah reactor (an upgrade of the UV one, twice the output) and naquadah based fuel MK2.
uev-naquadah-reactor=The UEV dynamo hatch, the UEV large naquadah reactor (twice the UHV output) and naquadah based fuel MK3.
uiv-naquadah-reactor=The UIV dynamo hatch and the UIV large naquadah reactor (twice the UEV output).
umv-naquadah-reactor=The UMV dynamo hatch and the UMV large naquadah reactor (twice the UIV output).
uxv-naquadah-reactor=The UXV dynamo hatch and the UXV large naquadah reactor (twice the UMV output).
lapotronic-energy-orbs=The lapotronic energy orb (IV battery) and a second recipe for the lapotronic energy orb cluster from the circuit assembler: eight orbs, qubit CPU chips and naquadah alloy instead of the lapotron chips of the ZPM assembly line.
super-coolant=Ledox and callisto ice from the end microminer and super coolant from them (HV mixer). Grade 5 and 7 water and the UIV to UXV energy and dynamo hatches need it.
fluxed-electrum=Fluxed electrum from electrum, redstone and naquadah (ZPM blast furnace): the UV voltage coil, the UHV emitter and sensor, the fusion reactor Mk-III controller and naquadah based fuel MK2 use it.
bedrockium=Bedrockium from the end microminer (UV blast furnace) and its cable, the UHV cable of the UHV components. The UEV machine casing is made of bedrockium plates.
space-coolant-cells=The 180k, 540k and 1080k space cells and the 1080k super coolant cell for the UEV to UXV energy and dynamo hatches.
quantium=Quantium from the end microminer (UHV blast furnace): its melt goes into the UEV components, its cable is the UMV cable of the UMV components.
dimensionally-transcendent-plasma-forge=The dimensionally transcendent plasma forge and its crude catalyst: neutronium, cosmic neutronium, infinity, transcendent metal, spacetime and universium with two thirds of the input of the fusion reactors and in a third of the reactor time.
dtpf-resplendent-catalyst=The resplendent catalyst (the crude one and five more plasmas): the plasma forge makes twice the batch in the same time and burns less catalyst per ingot.
quantum-force-transformer=The quantum force transformer: the platinum line (platinum and palladium metallic powder, the residues and the iridium group sludge) and the naquadah line in one step, one recipe per main output.
godforge=The Forge of the Gods (UXV, 13x13) after the stargate: raw star matter, its fuel, from hydrogen and helium, and lead, thorium and naquadria plasma for the stellar catalyst of the plasma forge.
godforge-molten-module=Universium in the Forge of the Gods: half the spacetime and flerovium per ingot of the fusion recipe, much faster.
godforge-exotic-module=Tachyon rich temporal and spatially enlarged fluid from spacetime, and magmatter, the MAX metal, from them and the melt of an endgame metal.
godforge-upgrades=Every level makes the Forge of the Gods' star matter, universium and magmatter recipes 5 % more productive. The long-term goal after victory.
dtpf-stellar-catalyst=The stellar catalyst (resplendent catalyst, lead, thorium and naquadria plasma, raw star matter): the plasma forge makes four times the crude batch in the same time.
max-materials=Magmatter parts and the magmatter cable.
planck-processors=The Planck line up to the supercomputer.
planck-processor-mainframes=The MAX circuit.
max-components=The MAX components, casing and hull, and a MAX science pack recipe from MAX parts and magmatter.
max-machines=The basic machines of the MAX tier.
max-energy-hatches=The maximum voltage coil and the MAX energy hatch.
max-multiblocks=The multiblock upgrades of the MAX tier.
max-plasma-turbine=The MAX dynamo hatch and the MAX large plasma turbine (20.97 GW).
large-steam-turbine=The large steam turbine (EV): steam to power at GT's 2 L per EU with its magnalium rotor, distilled water back through the turbine output hatch, which it unlocks too.
high-pressure-steam-turbine=The large HP steam turbine (IV): superheated steam to power, the steam goes on to a large steam turbine.
fluid-nuclear-reactor=The fluid nuclear reactor heats coolant with fuel rods, the large heat exchanger turns the hot coolant into steam or superheated steam for the steam turbines. Coolant from lapis and distilled water.
luv-lapotronic-supercapacitor=The LuV lapotronic capacitor block (orb cluster and osmiridium) and the LuV lapotronic supercapacitor, an upgrade of the IV one: five times the capacity, twice the power.
zpm-lapotronic-supercapacitor=The energy module, the ZPM lapotronic capacitor block and the ZPM lapotronic supercapacitor, an upgrade of the LuV one: five times the capacity, twice the power.

