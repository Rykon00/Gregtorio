steel-plated-microminer=Launched in a Microverse Projector (MV or higher) with overworld data and benzene: the tier one mission, or the nether, end and lunar navigation data.
stainless-steel-plated-microminer=Launched in a Microverse Projector (HV or higher) with nether data: the Nether Air Ender Tank.
titanium-plated-microminer=Launched in a Microverse Projector (EV or higher) with the end data: the Ender Air Ender Tank.
tungsten-carbide-plated-microminer=Launched in a Microverse Projector (IV or higher) with lunar navigation data and rocket fuel: the tier four mission.
overworld-data=Made in an assembling machine. Launched with the steel plated microminer in a Microverse Projector (MV or higher): the tier one mission and the nether, end and lunar navigation data.
nether-data=Made in a Microverse Projector (MV or higher). Used by the tier two mission (Microverse Projector, HV or higher) and the Nether Air Ender Tank.
the-end-data=Made in a Microverse Projector (MV or higher). Used by the tier three mission (Microverse Projector, EV or higher) and the Ender Air Ender Tank.
lunar-navigation-data=Made in a Microverse Projector (MV or higher). Used by the tier four mission (Microverse Projector, IV or higher).
tier-one-microminer-output=Brought back by the tier one mission of a Microverse Projector (MV or higher). Opened in an assembling machine: the ores of tier one.
tier-two-microminer-output=Brought back by the tier two mission of a Microverse Projector (HV or higher). Opened in an assembling machine: the ores of tier two.
tier-three-microminer-output=Brought back by the tier three mission of a Microverse Projector (EV or higher). Opened in an assembling machine: the ores of tier three.
tier-four-microminer-output=Brought back by the tier four mission of a Microverse Projector (IV or higher). Opened in an assembling machine: compressed moon turf.
fork-mold=Stays in the machine: put it into the mold slot (module slot) of an alloy smelter, fluid solidifier or extruder. It is not used up.

