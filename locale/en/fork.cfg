[entity-description]
bacterial-vat=Grows bacteria in sterilized fluids into bacterial sludge and other bio fluids; a multiblock of GT New Horizons' bartworks.
basic-nuclear-reactor=Burns nuclear fuel rods for electricity, up to 10.5 MW.
beam-crafter=Uses particle beams to make parts and casings of the Large Hadron Collider; part of the beamline.
cauldron=Washes impure and pure dust to dust with water, without power and without a byproduct.
coke-oven=Bakes coal and logs into coke and charcoal without power, with creosote as byproduct.
component-assembly-line=Builds the tiered components (motors, pumps, pistons, robot arms and more) in bulk from melts; GT New Horizons' goodgenerator multiblock.
crafting-table=Crafts the early parts by their hand recipes.
dyson-swarm-ground-unit=gtnhintergalactic's Dyson Swarm (UIV): deploys a Dyson Swarm Module and burns 100 gelid cryotheum a second; its swarm (up to 10 000 modules) gives 195.3 MW per module while it runs and loses about 7 % of its modules an hour.
ev-extreme-entity-crusher=Crushes the mobs of a filled soul vial for their drops.
fluid-trash-can=Destroys fluids.
fusion-reactor-mk1=Fuses light elements into heavier ones and plasmas (LuV); the plasmas run plasma turbines.
fusion-reactor-mk2=Fuses elements into heavier ones and plasmas, up to the ZPM recipes.
fusion-reactor-mk3=Fuses elements into heavier ones and plasmas, up to the UV recipes.
fusion-reactor-mk4=Fuses elements into heavier ones and plasmas, up to the UHV recipes, among them cosmic neutronium, draconium and infinity.
fusion-reactor-mk5=Fuses the endgame metals: spacetime, universium and the plasmas of the last tiers.
iron-furnace=Smelts ores and items with fuel, faster than the stone furnace.
iv-chemical-bath-plant=GT++'s multiblock chemical bath: runs the chemical bath recipes, several at once.
iv-fluid-shaper=GT++'s multiblock fluid solidifier: casts fluids and melts with a mold, several at once.
iv-hyper-intensity-laser-engraver=GT++'s multiblock laser engraver: engraves with a lens, several at once.
iv-industrial-centrifuge=GT++'s multiblock centrifuge: runs the centrifuge recipes, several at once.
iv-industrial-cutting-factory=GT++'s multiblock cutting machine: runs the cutting recipes, several at once.
iv-industrial-electrolyzer=GT++'s multiblock electrolyzer: runs the electrolysis recipes, several at once.
iv-industrial-extrusion-machine=GT++'s multiblock extruder: runs the extruder recipes, several at once.
iv-industrial-maceration-stack=GT++'s multiblock macerator: grinds ores and items, several at once.
iv-industrial-material-press=GT++'s multiblock press: runs the bending machine and forming press recipes, several at once.
iv-industrial-mixer=GT++'s multiblock mixer: runs the mixer recipes, several at once.
iv-industrial-precision-lathe=GT++'s multiblock lathe: runs the lathe recipes, several at once.
iv-industrial-wire-factory=GT++'s multiblock wiremill: draws wires, several at once.
iv-large-electric-compressor=GT New Horizons' multiblock compressor: runs the compressor recipes, several at once.
iv-large-extractor=GT New Horizons' large fluid extractor: melts and presses items into fluids, several at once.
iv-magnetic-flux-exhibiter=GT++'s multiblock polarizer and electromagnetic separator, several recipes at once.
iv-turbocan-pro=GT++'s multiblock canning machine: fills and empties cells, several at once.
iv-zyngen=GT++'s multiblock alloy smelter: smelts alloys, several at once.
large-bronze-boiler=Burns fuel for large amounts of steam; a multiblock of bronze.
large-coal-boiler=Burns coal and other fuels for steam.
large-extractor-ev-solenoids=GTNH's Large Fluid Extractor with EV solenoids: 4/5 of the IV solenoids' parallels (8 per solenoid tier).
large-extractor-hv-solenoids=GTNH's Large Fluid Extractor with HV solenoids: 3/5 of the IV solenoids' parallels (8 per solenoid tier).
large-extractor-mv-solenoids=GTNH's Large Fluid Extractor with MV solenoids: 2/5 of the IV solenoids' parallels (8 per solenoid tier).
large-hadron-collider=Accelerates particle beams; the EM module of the Large Hadron Collider.
large-hadron-collider-lhcb=Accelerates particle beams; the LHCb module of the Large Hadron Collider.
large-hadron-collider-weak=Accelerates particle beams; the weak module of the Large Hadron Collider.
large-steel-boiler=Burns fuel for large amounts of steam; a multiblock of steel.
luv-circuit-assembly-line=Assembles the circuits from the crystal processor on from their boards, parts and solder.
luv-mass-fabricator=Turns energy into UU matter.
lv-greenhouse=Grows wheat and trees with water and power.
flotation-cell=GT's Froth Flotation Cell (LuV): floats milled ore with a xanthate and pine oil, milled netherrack with nefarious oil, into a froth for the vacuum furnace.
isamill=GT++'s IsaMill (LuV): grinds crushed and raw ores with an alumina or soapstone milling ball into milled ore for the Flotation Cell; the ball wears out.
lv-miner=GT's Basic Miner (LV). Mines the map veins under it (17 x 17 tiles) at 2.7 ores a second. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
manual-digsite=Digs gravel, sand, clay and cobblestone by hand, with manual labor.
manual-research-lab=Researches the first technologies with manual labor and the red science pack.
mv-miner=GT's Good Miner (MV). Mines the map veins under it (33 x 33 tiles) at 5.3 ores a second. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
hv-miner=GT's Advanced Miner (HV). Mines the map veins under it (49 x 49 tiles) at 10.7 ores a second. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
naquadah-fuel-refinery=Refines the naquadah based fuels with its coils; better coils run the higher fuels.
naquadah-fuel-refinery-t2=Refines the naquadah based fuels with its coils; better coils run the higher fuels.
naquadah-fuel-refinery-t3=Refines the naquadah based fuels with its coils; better coils run the higher fuels.
naquadah-fuel-refinery-t4=Refines the naquadah based fuels with its coils; better coils run the higher fuels.
neutron-activator=Activates naquadah solutions and fuels with neutron kinetic energy.
ore-drilling-plant-mk1=GT's Ore Drilling Plant (MV). Mines the map veins under it (81 x 81 tiles) at 5.3 ores a second, with about 3 Drilling Fluid per ore (it stops without). Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
ore-drilling-plant-mk2=GT's Ore Drilling Plant II (HV). Mines the map veins under it (97 x 97 tiles) at 12.8 ores a second, with about 3 Drilling Fluid per ore (it stops without). Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
ore-drilling-plant-mk3=GT's Ore Drilling Plant III (EV). Mines the map veins under it (129 x 129 tiles) at 32 ores a second, with about 3 Drilling Fluid per ore (it stops without); a tile gives a quarter more ore. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
ore-drilling-plant-mk4=GT's Ore Drilling Plant IV (IV). Mines the map veins under it (193 x 193 tiles) at 85 ores a second, with about 3 Drilling Fluid per ore (it stops without); a tile gives two thirds more ore. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
pcb-factory=GT's PCB Factory at T1 (ZPM): prints the optical circuit board from a kevlar or radox plate, foils, acids and mysterious crystal.
powered-spawner=Fills soul vials with the mobs it spawns.
primitive-blast-furnace=Smelts iron into steel with coal or coke, without power.
slice-n-splice=Assembles EnderIO's parts from skulls and soul items, such as the Z-Logic controller.
small-coal-boiler=Burns coal and wood for steam, the first power of the steam age.
soul-binder=Binds the soul in a vial into an item, such as the Frank'n'Zombie.
source-chamber=Makes particle beams (electrons, protons) for the beamline.
void-miner-i=bartworks' Void Miner I (LuV): mines the ores of GT New Horizons' T3 to T7 dimensions (Pluto, Ceres, Ganymede, Io, Mercury, Titan, Enceladus, Miranda, Oberon, Proteus, Triton, Haumea, Makemake), 2 per second; neon, krypton or xenon multiply it.
space-elevator=gtnhintergalactic's Space Elevator with Mk-__1__ motors: it carries up to __2__ Space Elevator modules (#302, #303); on its own it does nothing.
space-elevator-mining-module=gtnhintergalactic's mining module: __1__ operations at a time. It needs a Space Elevator with Mk-__2__ motors or better within 2 tiles and a free module slot there. An operation takes a mining drone (kept), 4 drill heads, 4 rods and 825 helium plasma.
void-miner-ii=bartworks' Void Miner II (ZPM): mines the ores of the Void Miner I's dimensions and of the T8 ones (Barnard C, E and F, Centauri Bb, Tau Ceti E, Vega B), 4 per second; neon, krypton or xenon multiply it.
void-miner-iii=bartworks' Void Miner III (UV): mines the ores of the lower Void Miners' dimensions and of the T9 ones (Horus, Anubis, Neper, Seth, Maahes, the Mehen Belt), and with The Deep Dark every ore, 6 per second; neon, krypton or xenon multiply it.
ev-dehydrator=GT++'s EV dehydrator: dries fluids into dusts.
iv-dehydrator=GT++'s IV dehydrator: dries fluids into dusts.
luv-dehydrator=GT++'s LuV dehydrator: dries fluids into dusts.
water-purification-plant=Purifies water grade by grade with its purification units, up to the grade 8 water of the late circuits.
zpm-dehydrator=GT++'s ZPM dehydrator: dries fluids into dusts.
exxonmobil-chemical-plant=GT++'s chemical plant (MV, steel casings): ammonia and nitric acid into hydrated ammonium nitrate slurry for the samaric branch.
mv-dehydrator=GT++'s MV dehydrator: dries fluids into dusts.
hv-dehydrator=GT++'s HV dehydrator: dries fluids into dusts, among them the hydrated ammonium nitrate slurry into ammonium nitrate dust.
digester=GT New Horizons' digester (gtnhlanth): dissolves crushed monazite or bastnasite in nitric acid, the first step of the rare earth lines.
dissolution-tank=GT New Horizons' dissolution tank (gtnhlanth): dilutes the muddy monazite solution or the conditioned bastnasite mud with water and saltpeter.
large-combustion-engine=Burns combustion generator fuel cells (diesel, cetane-boosted diesel, gasoline, high octane gasoline) at 100 % and makes up to 20.48 MW, four EV amps (GT's large combustion engine: 2048 EU/t).
ev-rocket-engine=Burns rocket fuel cells at 80 % and makes up to 5.12 MW, one EV amp (GT++'s Basic Rocket Engine).
iv-rocket-engine=Burns rocket fuel cells at 70 % and makes up to 10.24 MW, one IV amp (GT++'s Advanced Rocket Engine).
luv-rocket-engine=Burns rocket fuel cells at 60 % and makes up to 20.48 MW, one LuV amp (GT++'s Turbo Rocket Engine).
large-gas-turbine=Burns gas turbine fuel cells and makes up to 20.48 MW, four EV amps, at 125 % with its large magnalium rotor (GT's large gas turbine).
large-titanium-boiler=Burns fuel and makes up to 640 superheated steam/s from water (GT's large titanium boiler: 4800 EU/t of steam, a third of it superheated), enough for three High Pressure Steam Turbines; 57.6 MW of fuel.
luv-large-plasma-turbine=Burns only the plasmas of the fusion reactors (fuel value per unit in the fluid's tooltip) and makes up to 81.92 MW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back (helium plasma -> helium, tin plasma -> molten tin, ...).
zpm-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 163.84 MW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
uv-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 327.68 MW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
uhv-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 655.36 MW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
uev-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 1.31 GW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
uiv-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 2.62 GW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
umv-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 5.24 GW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
uxv-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 10.49 GW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
turbine-output-hatch=Place it next to a Large Plasma Turbine or a steam turbine: it receives what the turbine gives back (plasma: the cooled fluid, one unit per unit; large steam turbine: distilled water, one per 16 steam; large HP steam turbine: steam, one per superheated steam). What does not fit waits in the turbine; without a hatch it is lost.
uv-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels (fuel value per unit in the fluid's tooltip) and makes up to 327.68 MW. Steam, plasma or other fuels stop it and stay in it.
uhv-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels and makes up to 655.36 MW. Steam, plasma or other fuels stop it and stay in it.
uev-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels and makes up to 1.31 GW. Steam, plasma or other fuels stop it and stay in it.
uiv-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels and makes up to 2.62 GW. Steam, plasma or other fuels stop it and stay in it.
umv-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels and makes up to 5.24 GW. Steam, plasma or other fuels stop it and stay in it.
uxv-large-naquadah-reactor=Burns only naquadah based fuel (MK1 to MK3) and the excited liquid nuclear fuels and makes up to 10.49 GW. Steam, plasma or other fuels stop it and stay in it.
dimensionally-transcendent-plasma-forge=Makes the endgame metals (neutronium to universium) with less input and in less time than the fusion reactors, burning an excited dimensionally transcendent catalyst. Draws 1.31 GW. Five fluid inputs north, one west, two outputs south.
quantum-force-transformer=Runs the quantum force transformer recipes: the platinum line and the naquadah line in one step. Each recipe focuses one output. Draws 1.31 GW.
godforge=The forge of the gods: celestial tungsten plasma and raw star matter (plasma module), after the stargate the plasmas of the stellar catalyst, universium (molten module) and magmatter (exotic module). Every recipe but the star matter burns some raw star matter. Draws 1.31 GW. Five fluid inputs north, one west, two outputs south.
nano-forge=GT's Nano Forge with a carbon nanite (tier 1): neutronium nanites. One fluid input north (UU matter).
nano-forge-t2=GT's Nano Forge with a neutronium nanite (tier 2): the tier 1 recipes and glowstone nanites. One fluid input north (UU matter).
nano-forge-t3=GT's Nano Forge with a transcendent metal nanite (tier 3): the tier 1 and 2 recipes. One fluid input north (UU matter).
draconic-evolution-fusion-crafter-t1=GT's Draconic Evolution Fusion Crafter with Bloody Ichorium Fusion Casings (tier 1). One fluid input north.
draconic-evolution-fusion-crafter-t2=GT's Draconic Evolution Fusion Crafter with Draconium Fusion Casings (tier 2): the tier 1 recipes too. One fluid input north.
draconic-evolution-fusion-crafter-t3=GT's Draconic Evolution Fusion Crafter with Wyvern Fusion Casings (tier 3): the tier 1 and 2 recipes too. One fluid input north.
draconic-evolution-fusion-crafter-t4=GT's Draconic Evolution Fusion Crafter with Awakened Draconium Fusion Casings and MK II fusion machine casings (tier 4): the tier 1 to 3 recipes too. One fluid input north.
max-large-plasma-turbine=Burns only the plasmas of the fusion reactors and makes up to 20.97 GW. Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the cooled fluid back.
large-steam-turbine=Burns only steam and makes up to 11.25 MW (GT's large turbine with a large magnalium rotor: 180 steam/s at 125 % efficiency). Superheated steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get distilled water back (one per 16 steam).
high-pressure-steam-turbine=Burns only superheated steam and makes up to 28.35 MW (GT's large turbine with a large titanium rotor: 210 superheated steam/s at 135 % efficiency). Steam or other fuels stop it and stay in it. Put a Turbine Output Hatch next to it to get the steam back (one per superheated steam), for a Large Steam Turbine.
fluid-nuclear-reactor=Burns nuclear fuel rods (fuel slot; depleted rods come out of the burnt result slot) at 10.5 MW, like the Basic Nuclear Reactor, and turns coolant (south) into hot coolant (north) instead of power: 5.25 hot coolant/s.
large-heat-exchanger=Turns hot coolant (west) and distilled water (south) into coolant (east) and steam or superheated steam (north), by recipe, without power: up to 160 hot coolant/s; one hot coolant gives 40 steam or 20 superheated steam, one distilled water goes in per 16 steam.
lapotronic-supercapacitor=A battery of 27 IV lapotronic capacitor blocks: holds 1012.5 GJ, charges and discharges at 20.48 MW (two IV amps, its energy and dynamo hatch) and loses 1 % of its capacity per day, as in GregTech.
luv-lapotronic-supercapacitor=27 LuV lapotronic capacitor blocks: holds 5062.5 GJ, charges and discharges at 40.96 MW (two LuV amps) and loses 1 % of its capacity per day.
zpm-lapotronic-supercapacitor=27 ZPM lapotronic capacitor blocks: holds 25312.5 GJ, charges and discharges at 81.92 MW (two ZPM amps) and loses 1 % of its capacity per day.
planetary-gas-siphon=gtnhintergalactic's Planetary Gas Siphon, standing for its orbit around a gas giant: choose a planet and a depth as its recipe; it draws the gas from the planet's atmosphere, no inputs. GT New Horizons' amounts divided by __1__.
space-elevator-pump-module=gtnhintergalactic's pump module: __1__ times the amount of its recipe's fluid, no inputs. It needs a Space Elevator with Mk-__2__ motors or better within 2 tiles and a free module slot there. GT New Horizons' amounts divided by __3__.
space-elevator-assembler-module-mk1=GT New Horizons' Space Elevator Assembler Module Mk-I: the space assembler's tier 1 recipes (the Singularity ME Storage Cell), 4 parallels at UHV. It needs a Space Elevator with Mk-I motors or better within 2 tiles and a free module slot there. A fluid input north.
large-rocket-engine=GT++'s Rocketdyne F-1A Engine: burns rocket fuel cells for a fixed 2 amps of IV, at 3 times their energy (as GT++ turns 3 x the fuel's value into its fixed output). GT++'s air intakes, carbon dioxide, lubricant and liquid hydrogen boost are left out.
universal-chemical-fuel-engine=GoodGenerator's Universal Chemical Fuel Engine: burns combustion and gas turbine fuel cells at 150 %, GT's ceiling, for up to one amp of LuV. GT's combustion promoter, which sets that efficiency, is left out, and rocket fuel cells go to the Large Rocket Engine.
reactor-fuel-processing-plant=GT++'s fuel refinery of the LFTR (IV): mixes lithium, beryllium, zirconium and thorium fluoride with uranium 235 or uranium tetrafluoride into LFTR Fuel 1 to 3. Four fluid inputs (north and the sides), one output (south).
liquid-fluoride-thorium-reactor=GT++'s LFTR (IV): burns LFTR Fuel 1, 2 or 3 with lithium tetrafluoroberyllate into the depleted salts, uranium hexafluoride and some molten uranium 233, and gives 40.96, 81.92 or 163.84 MW while it runs (it needs no power). Fuel and coolant in north, the outputs south and east.
sparge-tower=GT++'s Sparge Tower (LuV): blows helium through the uranium salt and fluorine through the thorium salts; the gases and fluorides come out with the sparged salt and the rest of the sparge gas.
cold-trap-i=GT++'s Cold Trap (IV): sodium fluoride traps fluorinated and phosphorous uranium hexafluoride into uranium hexafluoride, fluorine, uranium 233 and phosphorus.
reactor-processing-unit-i=GT++'s Reactor Processing Unit (IV): fluorine strips the LFTR's depleted salts into lithium and beryllium fluoride, protactinium and the uranium hexafluoride salts the Cold Trap takes.
nuclear-salt-processing-plant=GT++'s Nuclear Salt Processing Plant (IV): the recipes of the Reactor Processing Unit and the Cold Trap in one machine, 10 times as fast as them (GT: 4 parallels at IV, 2.5 times the speed) at 4 times their power.
precise-assembler-mk1=GoodGenerator's Precise Auto-Assembler MT-3662 with Mk-I casings (LuV): the precise assembler recipes of casing tier Mk-I, among them the Hi-Computation Stations; GT's normal assembler mode is left out.
precise-assembler-mk2=GoodGenerator's Precise Auto-Assembler MT-3662 with Mk-II casings (ZPM): the precise assembler recipes of casing tier Mk-I to Mk-II, among them the Hi-Computation Stations; GT's normal assembler mode is left out.
precise-assembler-mk3=GoodGenerator's Precise Auto-Assembler MT-3662 with Mk-III casings (UHV): the precise assembler recipes of casing tier Mk-I to Mk-III, among them the Hi-Computation Stations; GT's normal assembler mode is left out.
algae-farm=GT++'s Algae Farm (IV): red algae biomass from nothing but its pond, 4 at 90 % in 50 s; with 16 compost GT's next tier, 3 and 12 at 90 % in 25.6 s.
industrial-dehydrator=GT++'s Industrial Dehydrator (ZPM): the vacuum furnace and the multiblock chemical dehydrator, with naquadah coils (7201 K); 4 parallels at 2.2 times the speed, twice a ZPM machine's power.
cold-trap-ii=GT++'s Cold Trap II (ZPM): the Cold Trap I's recipes four times as fast. Built onto a Cold Trap I by fast replace or the upgrade planner.
reactor-processing-unit-ii=GT++'s Reactor Processing Unit II (ZPM): the Reactor Processing Unit I's recipes four times as fast. Built onto a Reactor Processing Unit I by fast replace or the upgrade planner.
manual-mine=Mines the map veins under it (7 x 7 tiles) at 6.4 ores a second, burning manual labor. Built onto another mine by fast replace or the upgrade planner, its inserters and belts stay.
dimension-mine=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with manual labor and a pickaxe.
lv-dimension-miner=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power; a vein takes 1 Mining Pipe.
mv-dimension-miner=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power; a vein takes 1 Mining Pipe.
hv-dimension-miner=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power; a vein takes 1 Mining Pipe.
dimension-drilling-plant-mk1=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
dimension-drilling-plant-mk2=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
dimension-drilling-plant-mk3=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
dimension-drilling-plant-mk4=Runs the vein recipes of the other dimensions (the Nether, the Twilight Forest, The End until they are surfaces, the Moon and later for good) with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
classic-manual-mine=Runs the vein recipes (classic ore mode) anywhere, with manual labor and a pickaxe.
classic-lv-miner=GT's Basic Miner (LV) of the classic ore mode: runs the vein recipes anywhere with power; a vein takes 1 Mining Pipe.
classic-mv-miner=GT's Good Miner (MV) of the classic ore mode: runs the vein recipes anywhere with power, twice as fast as the LV Miner; a vein takes 1 Mining Pipe.
classic-hv-miner=GT's Advanced Miner (HV) of the classic ore mode: runs the vein recipes anywhere with power, four times as fast as the LV Miner; a vein takes 1 Mining Pipe.
classic-ore-drilling-plant-mk1=GT's Ore Drilling Plant (MV) of the classic ore mode: runs the vein recipes anywhere with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
classic-ore-drilling-plant-mk2=GT's Ore Drilling Plant II (HV) of the classic ore mode: runs the vein recipes anywhere with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
classic-ore-drilling-plant-mk3=GT's Ore Drilling Plant III (EV) of the classic ore mode: runs the vein recipes anywhere with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
classic-ore-drilling-plant-mk4=GT's Ore Drilling Plant IV (IV) of the classic ore mode: runs the vein recipes anywhere with power, 200 Drilling Fluid and 1 Mining Pipe a vein.
nether-portal=Step onto it to go to the Nether and back. The Nether is at 1:8: a portal there leads to the nearest portal around 8 times its position on Nauvis (within 128 tiles), else a new one is built; from Nauvis, to the nearest within 16 tiles of an eighth of its position.
twilight-portal=Step onto it to go to the Twilight Forest and back, at 1:1: a portal leads to the nearest Twilight Portal within 128 tiles of its position on the other side, else a new one is built. GT New Horizons' pool of water with 12 flowers, opened with the Twilight Crystal.
end-portal=Step onto it to go to The End and back. You arrive on the main island next to its End Portal at the origin; the way back leads to the portal you came through. A frame of 12 portal blocks, each with an Eye of Ender.
gt-torch=Gives light at night without power, from the steam age on. It can be walked past.
ender-chest=Shares its 27 slots with every Ender Chest of the same three-colour code, on every surface. Set the code in the panel beside its window.
ender-tank=Shares its fluid with every Ender Tank of the same three-colour code, on every surface: the tanks of a code are levelled three times a second. Set the code in the panel beside its window.

