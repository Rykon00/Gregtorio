[mod-setting-name]
gregtorio-continued-show-machine-recipes=Show machine recipes in the crafting menu
gregtorio-continued-one-pack-research=Cheap research: one science pack per technology

[mod-setting-description]
gregtorio-continued-show-machine-recipes=Lists recipes that only a machine can make in the crafting menu (red background, like in vanilla), so you can find them and their alternatives. Turn it off to see only the recipes you can craft by hand.
gregtorio-continued-one-pack-research=Every technology costs one research unit with one science pack of each kind it needs, instead of hundreds or thousands. You still have to build each tier's science pack once. Technologies with a research trigger are unchanged. Can be turned on or off for a running game; what is already researched stays.

[fork-hint]
machine-recipes=Recipes with a red background in the crafting menu are made in machines, not by hand.
factoriopedia=Alt+click an item or recipe to open Factoriopedia: "Alternative recipes" lists every other way to make it and "Made in" the machines for it.
