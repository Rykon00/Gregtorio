[mod-setting-name]
gregtorio-continued-show-machine-recipes=Show machine recipes in the crafting menu
gregtorio-continued-one-pack-research=Cheap research: one science pack per technology
gregtorio-continued-ore-mode=Ore mode
gregtorio-continued-boiler-output=Boiler output
gregtorio-continued-gt-overclocking=GT overclocking

[mod-setting-description]
gregtorio-continued-show-machine-recipes=Lists recipes that only a machine can make in the crafting menu (red background, like in vanilla), so you can find them and their alternatives. Turn it off to see only the recipes you can craft by hand.
gregtorio-continued-one-pack-research=Every technology costs one research unit with one science pack of each kind it needs, instead of hundreds or thousands. You still have to build each tier's science pack once. Technologies with a research trigger are unchanged. Can be turned on or off for a running game; what is already researched stays.
gregtorio-continued-ore-mode=Chosen per game, before it starts. Map veins: GT New Horizons' ore veins are mixed ore patches on Nauvis, in the Nether, the Twilight Forest and The End; the Manual Mine, the Miners and the Ore Drilling Plants are mining drills placed on them. Classic vein recipes (the ore system up to 0.5.5): no ore patches; the mines run a recipe for each GT vein anywhere, unlocked where its ores are first needed. A save that was loaded with 0.5.6 or later has had its mines turned into drills, which classic mode cannot undo: it keeps those drills and the patches they stand on (new chunks get none), and the drills' items build the classic mines. Switching a classic save to map veins puts the veins into its generated chunks and turns the mines on veins of their surface into drills.
gregtorio-continued-boiler-output=Multiplies the steam per second of every boiler. The boiler burns its fuel just as much faster, so steam per fuel stays GT New Horizons'. 1 is GT New Horizons.
gregtorio-continued-gt-overclocking=GT New Horizons' overclocking: a machine's speed doubles per tier as before, its power grows 4 times per tier instead of 2, so a recipe costs twice the energy for every tier its machine is above the recipe's. Off: every machine overclocks perfectly (the same energy per craft on every tier). Makes every electric machine from MV up dearer; the generators keep their output.

